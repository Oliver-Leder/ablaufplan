<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hochzeit · Ablaufplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfaf7; --card:#fff; --ink:#1a1a1a; --ink-2:#4d4b47; --muted:#8d8a84;
  --line:#e6e2da; --line-2:#d2cdc3; --soft:#f4f1ec;
  --err:#a23d4a; --err-bg:#fbeef0; --warn:#8a6a1f; --warn-bg:#fbf5e4; --ok:#4f6b3f; --ok-bg:#eef4e8;
  --serif:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --sans:"Jost","Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
}
/* Pastellfarben – angelehnt an die Klebezettel */
[data-c="rose"]{--c:#e3a3ad;--cb:#fcf1f3;--ci:#96505c}
[data-c="apricot"]{--c:#eab48c;--cb:#fdf3eb;--ci:#9a5a2c}
[data-c="butter"]{--c:#e2cb7e;--cb:#fcf7e6;--ci:#86691a}
[data-c="sage"]{--c:#a9c196;--cb:#f2f6ee;--ci:#52703e}
[data-c="sky"]{--c:#9fbbd6;--cb:#eff4f9;--ci:#436584}
[data-c="lavender"]{--c:#bdaedb;--cb:#f5f2fb;--ci:#65538e}
[data-c="stone"]{--c:#c5c0b6;--cb:#f6f4f0;--ci:#5d5a54}

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 20px 90px}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto}
[hidden]{display:none!important}

/* Kopf */
header.hero{text-align:center;padding:56px 0 22px}
.eyebrow{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,7vw,60px);line-height:1.05;margin:12px 0 8px}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink-2)}
[contenteditable]{outline:none;border-radius:3px;transition:background .15s}
[contenteditable]:hover,[contenteditable]:focus{background:var(--soft)}
.dots{display:flex;justify-content:center;gap:9px;margin:22px 0 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--c);display:block}
.overview{text-align:center;margin-top:16px;font-size:13px;letter-spacing:.06em;color:var(--ink-2)}
.overview b{font-weight:500;color:var(--ink)}

/* Leiste */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0;margin-top:18px}
.toolbar .wrap{display:flex;gap:8px;align-items:center;position:relative}
.btn{background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:400}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#3a3a3a}
.btn.icon{padding:8px 12px}
.btn:disabled{opacity:.3;cursor:default;border-color:var(--line-2)}
.btn.danger{color:var(--err);border-color:#ebc9ce}
.btn.danger.armed{background:var(--err);color:#fff;border-color:var(--err)}
.spacer{flex:1}
.pill{border:0;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:400}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -18px rgba(0,0,0,.3);padding:6px;min-width:230px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .danger{color:var(--err)}
.issues{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px;padding:6px 16px}
.issues li{list-style:none;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer;display:flex;gap:10px;font-size:14px}
.issues li:last-child{border-bottom:0}
.issues ul{margin:0;padding:0}
.issues li:hover span:last-child{text-decoration:underline}
.issues .lv{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--warn)}
.issues .lv.err{background:var(--err)}

/* Zeitleiste */
ol.timeline{list-style:none;margin:30px 0 0;padding:0;position:relative}
ol.timeline:before{content:"";position:absolute;left:103px;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.row{display:grid;grid-template-columns:86px 34px 1fr;padding:0 0 12px;position:relative}
.time{text-align:right;padding-top:13px}
.t-start{font-family:var(--serif);font-size:23px;line-height:1;font-weight:600;display:block;color:var(--ci)}
.row:not(.fixed) .t-start{font-weight:400;color:var(--ink-2)}
.t-end{font-size:12px;color:var(--muted);display:block;margin-top:4px}
.plus1{font-size:10px;vertical-align:super;color:var(--muted);margin-left:1px}
.node{position:relative}
.node:after{content:"";position:absolute;left:12px;top:17px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--c)}
.row.fixed .node:after{background:var(--c)}
.row.has-err .node:after{border-color:var(--err);background:var(--err)}
.card{background:linear-gradient(100deg,var(--cb) 0%,#fff 70%);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:4px 10px 10px 4px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:0 10px;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:0 8px 22px -16px rgba(0,0,0,.35)}
.row.open .card{box-shadow:0 14px 34px -18px rgba(0,0,0,.35);border-color:var(--c);border-left-width:4px}
.head{cursor:pointer;min-width:0}
.title{color:var(--ink);font-family:var(--serif);font-size:22px;line-height:1.2;font-weight:500;margin:0}
.meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.meta span+span:before{content:" · ";color:var(--line-2)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.badge{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--cb);color:var(--ci)}
.row.parallel .badge{background:#fff}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}
.preview{font-size:13.5px;color:var(--ink-2);margin-top:7px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grip{cursor:grab;color:var(--line-2);font-size:15px;padding:4px 2px;user-select:none;letter-spacing:-2px;align-self:start}
.grip:hover{color:var(--ink)}
.row.parallel .card{margin-left:22px;background:var(--cb);border-style:dashed;border-left-style:solid}
.row.parallel .node:before{content:"";position:absolute;left:24px;top:23px;width:22px;border-top:1px dashed var(--c)}
.row.parallel .t-start{font-size:17px}
.sublabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ci);margin-bottom:2px}

.gap{display:grid;grid-template-columns:86px 34px 1fr;padding:0 0 12px}
.gap .gl{grid-column:3;display:flex;align-items:center;gap:12px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted)}
.gap button{font-family:var(--sans);font-style:normal;font-size:12.5px;background:none;border:1px dashed var(--line-2);border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--ink-2)}
.gap button:hover{border-color:var(--ink);color:var(--ink)}
.gap.conflict .gl{color:var(--err)}

.row.dragging{opacity:.35}
.row.drop-before:before,.row.drop-after:after{content:"";position:absolute;left:86px;right:0;height:2px;background:var(--ink);z-index:3}
.row.drop-before:before{top:-7px}
.row.drop-after:after{bottom:4px}

/* Editor */
.editor{grid-column:1 / -1;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fld{margin-bottom:16px}
.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
.inp{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:9px 12px;font-size:15px;font-weight:400}
.inp:focus{outline:none;border-color:var(--ink)}
.inp.big{font-family:var(--serif);font-size:22px;font-weight:500;padding:6px 12px}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--ci,var(--ink));color:#fff}
.hbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.hbox input[type=time],.hbox input[type=number]{width:auto;min-width:110px}
.hbox input[type=number]{width:90px;min-width:0}
.hint{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-2)}
.rnd{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:#fff;cursor:pointer;font-size:16px;line-height:1}
.rnd:hover{border-color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--cb);border-color:var(--c);color:var(--ci)}
.chip.on:before{content:"✓ "}
.list .item{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.list .item .inp{border:0;padding:5px 0;background:transparent;border-radius:0}
.list .item.done .inp{text-decoration:line-through;color:var(--muted)}
.cb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid var(--ci,var(--ink));border-radius:5px;margin:0;display:grid;place-content:center;cursor:pointer;flex:none;background:#fff}
.cb:checked{background:var(--ci,var(--ink));border-color:var(--ci,var(--ink))}
.cb:checked:after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.x:hover{color:var(--err)}
.plus{width:18px;text-align:center;color:var(--muted);flex:none}
.comment{padding:9px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:1fr auto}
.comment .who{font-size:12.5px;font-weight:500}
.comment .who span{color:var(--muted);font-weight:300;margin-left:8px}
.comment .txt{grid-column:1 / -1;white-space:pre-wrap;font-size:14.5px}
.newc{display:grid;grid-template-columns:130px 1fr auto;gap:8px;margin-top:10px}
.edfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}

/* Team-Fragen */
.team{margin-top:46px;background:linear-gradient(100deg,#f5f2fb 0%,#fff 70%);border-left:4px solid #bdaedb;border:1px solid var(--line);border-radius:14px;padding:18px 22px}
.team h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 4px}
.team p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.team .list .item .cb{--ci:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 12px 10px 18px;border-radius:999px;font-size:13.5px;display:flex;align-items:center;gap:14px;transition:all .25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
footer{text-align:center;margin-top:40px;color:var(--muted);font-size:12.5px}

@media (max-width:640px){
  body{padding:0 16px 90px}
  header.hero{padding-top:36px}
  ol.timeline:before{left:65px}
  .row,.gap{grid-template-columns:54px 24px 1fr}
  .node:after{left:6px}
  .row.parallel .card{margin-left:10px}
  .row.parallel .node:before{left:18px;width:12px}
  .t-start{font-size:18px}
  .row.parallel .t-start{font-size:15px}
  .t-end{font-size:11px}
  .two,.newc{grid-template-columns:1fr}
  .btn{padding:7px 12px}
  .hide-sm{display:none}
  .row.drop-before:before,.row.drop-after:after{left:54px}
}
@media print{
  body{background:#fff;padding:0}
  .toolbar,.issues,.gap button,.grip,.edfoot,.newc,.toast,.x,footer{display:none!important}
  .row{break-inside:avoid}
}
</style>
</head>
<body>

<header class="hero wrap">
  <div class="eyebrow">Ablaufplan</div>
  <h1 contenteditable="true" data-meta="title"></h1>
  <div class="sub" contenteditable="true" data-meta="subtitle"></div>
  <div class="dots"><i data-c="rose"></i><i data-c="apricot"></i><i data-c="butter"></i><i data-c="sage"></i><i data-c="sky"></i><i data-c="lavender"></i></div>
  <div class="overview" id="overview"></div>
</header>

<nav class="toolbar">
  <div class="wrap">
    <button class="btn primary" id="addBtn">+ Neuer Punkt</button>
    <button class="btn icon" id="undoBtn" title="Rückgängig (⌘Z)">↶<span class="hide-sm">&nbsp;Rückgängig</span></button>
    <span class="spacer"></span>
    <button class="pill ok" id="statusBtn"></button>
    <button class="btn icon" id="menuBtn" title="Mehr">•••</button>
    <div class="menu" id="menu" hidden>
      <button data-menu="export">Als Datei sichern</button>
      <button data-menu="import">Datei laden</button>
      <button data-menu="copy">Als Text kopieren</button>
      <button data-menu="print">Drucken</button>
      <hr>
      <button data-menu="reset" class="danger">Alles auf Anfang zurücksetzen</button>
    </div>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
  </div>
  <div class="wrap"><div class="issues" id="issues" hidden></div></div>
</nav>

<main class="wrap">
  <ol class="timeline" id="timeline"></ol>
  <section class="team" id="team"></section>
</main>

<footer class="wrap">
  Wird automatisch in diesem Browser gespeichert. Zum Teilen im Team: ••• → „Als Datei sichern“ und bei den anderen „Datei laden“.
</footer>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">Rückgängig</button></div>

s": "Kein Programm während des Essens – nur zwischen den Gängen.", "id": "p29", "todos": []}, {"title": "Sandmalerei", "color": "lavender", "dur": 15, "tentative": true, "details": "Zwischen Vorspeise und Hauptgang (alternativ nach dem Dessert).", "id": "p30", "todos": []}, {"title": "Hauptgang", "color": "sage", "dur": 60, "tentative": true, "id": "p31", "todos": []}, {"title": "Video-Quiz", "color": "lavender", "dur": 20, "details": "Max. 20 Minuten. Rote Linie: die Geschichte der Kiste.\nVorgaben allgemein: Format, Länge. Pro Szene drei Antwortmöglichkeiten.", "todos": [{"id": "t33", "text": "Vorgaben an alle Mitwirkenden", "done": false}, {"id": "t34", "text": "Schatzkiste für den 1. Hochzeitstag bauen", "done": false}, {"id": "t35", "text": "Aufruf an Gäste: Mitbringsel für die Schatzkiste", "done": false}], "id": "p32"}, {"title": "Dessert", "color": "sage", "dur": 30, "tentative": true, "id": "p36", "todos": []}, {"title": "Party", "color": "apricot", "auto": true, "tentative": true, "details": "Steht nicht auf dem Zettel – Platzhalter bis zum Schluss.\nHochprozentiges kommt vom Schloss.", "id": "p37", "todos": []}, {"title": "Schluss", "color": "rose", "fixed": true, "time": "02:30", "dur": 0, "id": "p38", "todos": []}], "questions": [{"id": "q0", "text": "Kirche: Gäste informieren, dass sie ihr Zimmer in der Location erst später beziehen?", "done": false}, {"id": "q1", "text": "Begrüßung nach dem Shooting: Wie jubeln wir? Fanfare?", "done": false}, {"id": "q2", "text": "Partystimmung: Jede*r bekommt etwas in die Hand – aber was?", "done": false}, {"id": "q3", "text": "Welche Nebenprogramm-Ideen setzen wir um, und wer besorgt was?", "done": false}, {"id": "q4", "text": "Ablaufplan: Wer baut ihn? → dieser Plan", "done": true}]};
const KEY = 'hochzeit-ablauf-v2';
const COLORS = [['rose','Rosé'],['apricot','Apricot'],['butter','Champagner'],['sage','Salbei'],['sky','Taubenblau'],['lavender','Lavendel'],['stone','Neutral']];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

/* ---------- Zustand ---------- */
function blank(o = {}){ return Object.assign({id:uid(), title:'', color:'sage', fixed:false, time:'', dur:30, auto:false, parallel:false, tentative:false, location:'', person:'', details:'', todos:[], comments:[]}, o); }
function normalize(s){
  s.meta = Object.assign({title:'Hochzeit', subtitle:'Planungsteam'}, s.meta || {});
  s.items = (s.items || []).map(x => blank(x));
  s.questions = s.questions || [];
  s.author = s.author || '';
  return s;
}
const fresh = () => normalize(JSON.parse(JSON.stringify(SEED || {items:[]})));
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
state = state && Array.isArray(state.items) ? normalize(state) : fresh();

let openId = null, issuesOpen = false, focusSnap = null;
const past = [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
const snap = () => JSON.stringify(state);
const pushHistory = s => { past.push(s ?? snap()); if (past.length > 80) past.shift(); };
function commit(fn, msg){ pushHistory(); fn(); save(); render(); if (msg) toast(msg, true); }
function undo(){ if (!past.length) return; state = JSON.parse(past.pop()); save(); render(); }

/* ---------- Zeitrechnung ---------- */
const toMin = hm => { const m = /^(\d{1,2}):(\d{2})$/.exec(hm || ''); return m ? +m[1] * 60 + +m[2] : null; };
function resolve(hm, ref){ let m = toMin(hm); if (m == null || ref == null) return m; while (m < ref - 360) m += 1440; return m; }
const pad = n => String(n).padStart(2, '0');
const hhmm = m => m == null ? '–' : (d => pad(Math.floor(d / 60)) + ':' + pad(d % 60))(((m % 1440) + 1440) % 1440);
const fmtT = m => m == null ? '–' : hhmm(m) + (m >= 1440 ? '<span class="plus1" title="Folgetag">+1</span>' : '');
function fmtDur(d){ if (d == null) return '–'; if (d <= 0) return '0 Min.'; const h = Math.floor(d / 60), m = d % 60; return [h && h + ' Std.', m && m + ' Min.'].filter(Boolean).join(' '); }
const T = x => x.title || 'Ohne Titel';

function compute(){
  const items = state.items, res = {}, issues = [];
  const add = (level, id, text) => issues.push({level, id, text});
  const mainIdx = items.map((x, i) => x.parallel ? -1 : i).filter(i => i >= 0);
  let prevEnd = null, prev = null;
  items.forEach((x, i) => {
    if (x.parallel) return;
    const r = res[x.id] = {gap:0};
    if (x.fixed && toMin(x.time) != null){
      r.start = resolve(x.time, prevEnd);
      if (prevEnd != null){ r.gap = r.start - prevEnd; if (r.gap < 0) add('err', x.id, `„${T(x)}“ beginnt ${fmtDur(-r.gap)} bevor „${T(prev)}“ endet`); }
    } else if (prevEnd == null){ r.start = 8 * 60; add('err', x.id, `Der erste Punkt braucht eine feste Uhrzeit`); }
    else r.start = prevEnd;
    let dur = +x.dur || 0;
    if (x.auto){
      const nx = items[mainIdx.find(j => j > i)];
      if (nx && nx.fixed && toMin(nx.time) != null){ dur = resolve(nx.time, r.start) - r.start; r.autoTo = T(nx); }
      else { dur = 0; add('warn', x.id, `„${T(x)}“ läuft bis zum nächsten Punkt – der hat aber keine feste Uhrzeit`); }
    }
    if (dur < 0) add('err', x.id, `„${T(x)}“ endet, bevor es beginnt`);
    r.dur = dur; r.end = r.start + dur; prevEnd = r.end; prev = x;
  });
  let parent = null;
  items.forEach((x, i) => {
    if (!x.parallel){ parent = x; return; }
    const r = res[x.id] = {gap:0};
    if (!parent){ r.start = 8 * 60; add('err', x.id, `„${T(x)}“ ist „nebenher“, steht aber ganz oben`); }
    else { r.parent = T(parent); r.start = x.fixed && toMin(x.time) != null ? resolve(x.time, res[parent.id].start) : res[parent.id].start; }
    let dur = +x.dur || 0;
    if (x.auto){
      const nx = items.slice(i + 1).find(y => !y.parallel);
      if (nx){ dur = res[nx.id].start - r.start; r.autoTo = T(nx); } else dur = 0;
    }
    r.dur = dur; r.end = r.start + dur;
  });
  items.forEach(x => { if (!x.title.trim()) add('warn', x.id, 'Ein Punkt hat noch keinen Titel'); });
  const mains = items.filter(x => !x.parallel);
  const first = mains.length ? res[mains[0].id].start : null;
  const last = mains.length ? res[mains[mains.length - 1].id].end : null;
  return {res, issues, first, last};
}

/* ---------- Darstellung ---------- */
const tl = $('#timeline');
function render(){
  const ae = document.activeElement, fk = ae?.dataset?.k, sel = ae && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null;
  const {res, issues, first, last} = compute();
  const errs = issues.filter(i => i.level === 'err').length, warns = issues.length - errs;

  document.querySelectorAll('[data-meta]').forEach(el => { if (el !== ae) el.textContent = state.meta[el.dataset.meta] || ''; });
  document.title = (state.meta.title || 'Hochzeit') + ' · Ablaufplan';
  $('#overview').innerHTML = first != null
    ? `<b>${fmtT(first)} – ${fmtT(last)} Uhr</b> · ${fmtDur(last - first)} · ${state.items.length} Punkte`
    : '';

  const sb = $('#statusBtn');
  sb.className = 'pill ' + (errs ? 'err' : warns ? 'warn' : 'ok');
  sb.innerHTML = errs ? `● ${errs} Konflikt${errs > 1 ? 'e' : ''}` : warns ? `● ${warns} Hinweis${warns > 1 ? 'e' : ''}` : '✓ Zeiten passen';
  sb.disabled = !issues.length;
  if (!issues.length) issuesOpen = false;
  $('#issues').hidden = !issuesOpen;
  $('#issues').innerHTML = '<ul>' + issues.map(i => `<li data-jump="${i.id}"><span class="lv ${i.level}"></span><span>${esc(i.text)}</span></li>`).join('') + '</ul>';

  let html = '';
  state.items.forEach((x, i) => {
    const r = res[x.id];
    const my = issues.filter(s => s.id === x.id);
    if (!x.parallel && i > 0 && r.gap){
      html += r.gap > 0
        ? `<li class="gap"><div class="gl">${fmtDur(r.gap)} frei <button data-act="fillgap" data-id="${x.id}" data-gap="${r.gap}">+ Punkt einfügen</button></div></li>`
        : `<li class="gap conflict"><div class="gl">Überschneidung · ${fmtDur(-r.gap)}</div></li>`;
    }
    const open = openId === x.id;
    const doneN = x.todos.filter(t => t.done).length;
    const meta = [`<span>${fmtDur(r.dur)}</span>`];
    if (x.location) meta.push(`<span>${esc(x.location)}</span>`);
    if (x.person) meta.push(`<span>${esc(x.person)}</span>`);
    html += `<li class="row${x.fixed ? ' fixed' : ''}${x.parallel ? ' parallel' : ''}${open ? ' open' : ''}${my.some(s => s.level === 'err') ? ' has-err' : ''}" data-id="${x.id}" data-c="${esc(x.color)}">
      <div class="time" title="${x.fixed ? 'Feste Uhrzeit' : 'Schließt automatisch an'}"><span class="t-start">${fmtT(r.start)}</span><span class="t-end">bis ${fmtT(r.end)}</span></div>
      <div class="node"></div>
      <article class="card">
        <div class="head" data-act="toggle" data-id="${x.id}">
          ${x.parallel ? `<div class="sublabel">Nebenher${r.parent ? ' · ab ' + esc(r.parent) : ''}</div>` : ''}
          <h3 class="title">${esc(x.title) || '<span style="color:var(--muted)">Ohne Titel</span>'}</h3>
          <div class="meta">${meta.join('')}</div>
          <div class="badges">
            ${x.tentative ? '<span class="badge warn">vorläufig</span>' : ''}
            ${my.map(s => `<span class="badge ${s.level}">${s.level === 'err' ? 'Konflikt' : 'Hinweis'}</span>`).join('')}
            ${x.todos.length ? `<span class="badge">☑ ${doneN}/${x.todos.length}</span>` : ''}
            ${x.comments.length ? `<span class="badge">💬 ${x.comments.length}</span>` : ''}
          </div>
          ${!open && x.details ? `<div class="preview">${esc(x.details)}</div>` : ''}
        </div>
        <div class="grip" data-grip title="Ziehen zum Verschieben">⋮⋮</div>
        ${open ? editor(x, r, i) : ''}
      </article>
    </li>`;
  });
  tl.innerHTML = html || '<li style="text-align:center;padding:40px;color:var(--muted)">Noch leer. Oben auf „+ Neuer Punkt“.</li>';

  const qOpen = state.questions.filter(q => !q.done).length;
  $('#team').innerHTML = `<h2>Offene Fragen im Team</h2><p>${qOpen ? qOpen + ' offen' : 'Alles geklärt'} · abhaken, ergänzen, löschen</p>
    <div class="list">${state.questions.map(q => `<div class="item${q.done ? ' done' : ''}">
      <input type="checkbox" class="cb" data-act="q-done" data-q="${q.id}" ${q.done ? 'checked' : ''}>
      <input class="inp" data-k="q:${q.id}" data-qtext="${q.id}" value="${esc(q.text)}">
      <button class="x" data-act="q-del" data-q="${q.id}" title="Löschen">×</button></div>`).join('')}
      <div class="item"><span class="plus">+</span><input class="inp" data-k="q:new" data-qnew placeholder="Neue Frage – Enter"></div></div>`;

  if (fk){ const el = document.querySelector(`[data-k="${CSS.escape(fk)}"]`); if (el){ el.focus({preventScroll:true}); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch(e){} } }
  $('#undoBtn').disabled = !past.length;
}

function editor(x, r, i){
  const id = x.id, k = f => `data-k="${id}:${f}" data-f="${f}" data-id="${id}"`;
  const seg = (f, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-act="set" data-id="${id}" data-f="${f}" data-v="${v}" class="${String(x[f]) === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  return `<div class="editor">
    <div class="fld"><label class="lbl">Titel</label><input class="inp big" ${k('title')} value="${esc(x.title)}" placeholder="z. B. Sektempfang"></div>

    <div class="two">
      <div class="fld"><label class="lbl">Wann?</label>
        ${seg('fixed', [['true', 'Feste Uhrzeit'], ['false', x.parallel ? 'Mit dem Hauptpunkt' : 'Im Anschluss']])}
        <div class="hbox">${x.fixed ? `<input type="time" class="inp" ${k('time')} value="${esc(x.time)}">` : `<span class="hint">beginnt um ${hhmm(r.start)}</span>`}</div>
      </div>
      <div class="fld"><label class="lbl">Wie lange?</label>
        ${seg('auto', [['false', 'Minuten'], ['true', 'Bis zum nächsten Punkt']])}
        <div class="hbox">${x.auto ? `<span class="hint">${fmtDur(r.dur)}, bis ${hhmm(r.end)}</span>` :
          `<button class="rnd" data-act="step" data-id="${id}" data-d="-5">−</button><input type="number" min="0" step="5" class="inp" ${k('dur')} value="${x.dur ?? ''}"><button class="rnd" data-act="step" data-id="${id}" data-d="5">+</button><span class="hint">bis ${hhmm(r.end)}</span>`}</div>
      </div>
    </div>

    <div class="fld"><label class="lbl">Farbe</label><div class="swatches">${COLORS.map(([c, n]) => `<button class="sw${x.color === c ? ' on' : ''}" data-c="${c}" data-act="color" data-id="${id}" data-v="${c}" title="${n}"></button>`).join('')}</div></div>

    <div class="fld"><div class="chips">
      <button class="chip${x.parallel ? ' on' : ''}" data-act="flip" data-id="${id}" data-f="parallel">Läuft nebenher</button>
      <button class="chip${x.tentative ? ' on' : ''}" data-act="flip" data-id="${id}" data-f="tentative">Noch vorläufig</button>
    </div></div>

    <div class="two">
      <div class="fld"><label class="lbl">Ort</label><input class="inp" ${k('location')} value="${esc(x.location)}" placeholder="optional"></div>
      <div class="fld"><label class="lbl">Wer kümmert sich?</label><input class="inp" ${k('person')} value="${esc(x.person)}" placeholder="optional"></div>
    </div>

    <div class="fld"><label class="lbl">Notizen</label><textarea class="inp" ${k('details')} placeholder="Ablauf, Ideen, Absprachen …">${esc(x.details)}</textarea></div>

    <div class="fld"><label class="lbl">Aufgaben &amp; Material</label><div class="list">
      ${x.todos.map(t => `<div class="item${t.done ? ' done' : ''}">
        <input type="checkbox" class="cb" data-act="todo-done" data-id="${id}" data-t="${t.id}" ${t.done ? 'checked' : ''}>
        <input class="inp" data-k="${id}:t:${t.id}" data-todo="${t.id}" data-id="${id}" value="${esc(t.text)}">
        <button class="x" data-act="todo-del" data-id="${id}" data-t="${t.id}" title="Entfernen">×</button></div>`).join('')}
      <div class="item"><span class="plus">+</span><input class="inp" data-k="${id}:t:new" data-newtodo="${id}" placeholder="Neue Aufgabe – Enter"></div>
    </div></div>

    <div class="fld"><label class="lbl">Kommentare</label>
      ${x.comments.map(c => `<div class="comment"><div class="who">${esc(c.author || 'Anonym')}<span>${new Date(c.ts).toLocaleString('de-DE', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</span></div>
        <button class="x" data-act="com-del" data-id="${id}" data-c="${c.id}" title="Löschen">×</button><div class="txt">${esc(c.text)}</div></div>`).join('')}
      <div class="newc"><input class="inp" data-k="author" data-author value="${esc(state.author)}" placeholder="Dein Name">
        <input class="inp" data-k="${id}:c:new" data-newcom="${id}" placeholder="Kommentar – Enter">
        <button class="btn" data-act="com-add" data-id="${id}">Senden</button></div>
    </div>

    <div class="edfoot">
      <button class="btn icon" data-act="move" data-d="-1" data-id="${id}" ${i === 0 ? 'disabled' : ''} title="Nach oben">↑</button>
      <button class="btn icon" data-act="move" data-d="1" data-id="${id}" ${i === state.items.length - 1 ? 'disabled' : ''} title="Nach unten">↓</button>
      <button class="btn" data-act="dup" data-id="${id}">Duplizieren</button>
      <button class="btn danger" data-act="del" data-id="${id}">Löschen</button>
      <span class="spacer"></span>
      <button class="btn primary" data-act="toggle" data-id="${id}">Fertig</button>
    </div>
  </div>`;
}

/* ---------- Aktionen ---------- */
const find = id => state.items.find(x => x.id === id);
const idx = id => state.items.findIndex(x => x.id === id);
function openAndFocus(id){
  openId = id; render();
  const el = document.querySelector(`[data-k="${id}:title"]`);
  if (el){ el.focus({preventScroll:true}); el.closest('.row').scrollIntoView({behavior:'smooth', block:'center'}); }
}
function armed(b, label, fn){
  if (!b.classList.contains('armed')){ b.classList.add('armed'); const old = b.textContent; b.textContent = label; setTimeout(() => { if (b.isConnected){ b.classList.remove('armed'); b.textContent = old; } }, 3000); return; }
  fn();
}

$('#addBtn').onclick = () => {
  const ref = openId ? find(openId) : null;
  const n = blank({color: ref ? ref.color : 'sage'});
  commit(() => ref ? state.items.splice(idx(ref.id) + 1, 0, n) : state.items.push(n));
  openAndFocus(n.id);
};
$('#undoBtn').onclick = undo;
$('#statusBtn').onclick = () => { issuesOpen = !issuesOpen; render(); };
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; };
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('#menu').hidden = true; });

document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !['INPUT', 'TEXTAREA'].includes(tag) && !document.activeElement?.isContentEditable){ e.preventDefault(); undo(); }
  if (e.key === 'Escape'){ $('#menu').hidden = true; if (openId){ openId = null; document.activeElement?.blur(); render(); } }
});

document.querySelectorAll('[data-meta]').forEach(el => {
  el.addEventListener('focus', () => { focusSnap = snap(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
  el.addEventListener('blur', () => { const v = el.textContent.trim(); if (v !== state.meta[el.dataset.meta]){ pushHistory(focusSnap); state.meta[el.dataset.meta] = v; save(); render(); } });
});

document.addEventListener('click', e => {
  const jump = e.target.closest('[data-jump]');
  if (jump){ issuesOpen = false; openId = jump.dataset.jump; render(); document.querySelector(`.row[data-id="${openId}"]`)?.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.type === 'checkbox') return;
  const id = b.dataset.id, x = find(id), a = b.dataset.act;
  switch (a){
    case 'toggle': openId = openId === id ? null : id; render(); break;
    case 'set': commit(() => {
      const v = b.dataset.v === 'true';
      if (b.dataset.f === 'fixed' && v && !x.time) x.time = hhmm(compute().res[id].start);
      if (b.dataset.f === 'auto' && !v) x.dur = Math.max(0, compute().res[id].dur);
      x[b.dataset.f] = v;
    }); break;
    case 'flip': commit(() => { x[b.dataset.f] = !x[b.dataset.f]; }); break;
    case 'color': commit(() => { x.color = b.dataset.v; }); break;
    case 'step': commit(() => { x.dur = Math.max(0, (+x.dur || 0) + +b.dataset.d); }); break;
    case 'move': { const i = idx(id), j = i + +b.dataset.d; if (j < 0 || j >= state.items.length) return; commit(() => { const [m] = state.items.splice(i, 1); state.items.splice(j, 0, m); }); break; }
    case 'dup': { const c = JSON.parse(JSON.stringify(x)); Object.assign(c, {id:uid(), title:x.title + ' (Kopie)', fixed:false, comments:[]}); c.todos.forEach(t => t.id = uid()); commit(() => state.items.splice(idx(id) + 1, 0, c)); openAndFocus(c.id); break; }
    case 'del': armed(b, 'Wirklich löschen?', () => commit(() => { state.items.splice(idx(id), 1); openId = null; }, `„${T(x)}“ gelöscht`)); break;
    case 'fillgap': { const n = blank({dur:+b.dataset.gap, color:x.color}); commit(() => state.items.splice(idx(id), 0, n)); openAndFocus(n.id); break; }
    case 'todo-del': commit(() => { x.todos = x.todos.filter(t => t.id !== b.dataset.t); }); break;
    case 'com-add': addComment(id); break;
    case 'com-del': commit(() => { x.comments = x.comments.filter(c => c.id !== b.dataset.c); }, 'Kommentar gelöscht'); break;
    case 'q-del': commit(() => { state.questions = state.questions.filter(q => q.id !== b.dataset.q); }, 'Frage gelöscht'); break;
  }
});
function addComment(id){
  const el = document.querySelector(`[data-newcom="${id}"]`), t = el?.value.trim();
  if (!t){ el?.focus(); return; }
  commit(() => find(id).comments.push({id:uid(), author:state.author, text:t, ts:Date.now()}));
}

const TEXT = ['title', 'location', 'person', 'details'];
document.addEventListener('focusin', () => { focusSnap = snap(); });
document.addEventListener('input', e => {
  const el = e.target, x = find(el.dataset.id);
  if (el.hasAttribute('data-author')) state.author = el.value;
  else if (el.dataset.todo){ const t = x?.todos.find(t => t.id === el.dataset.todo); if (t) t.text = el.value; }
  else if (el.dataset.qtext){ const q = state.questions.find(q => q.id === el.dataset.qtext); if (q) q.text = el.value; }
  else if (x && TEXT.includes(el.dataset.f)) x[el.dataset.f] = el.value;
  else return;
  save();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'todo-done'){ commit(() => { find(el.dataset.id).todos.find(t => t.id === el.dataset.t).done = el.checked; }); return; }
  if (el.dataset.act === 'q-done'){ commit(() => { state.questions.find(q => q.id === el.dataset.q).done = el.checked; }); return; }
  if (el.dataset.todo || el.dataset.qtext || TEXT.includes(el.dataset.f)){ pushHistory(focusSnap); focusSnap = snap(); render(); return; }
  const x = find(el.dataset.id); if (!x) return;
  if (el.dataset.f === 'time' && el.value){ pushHistory(focusSnap); x.time = el.value; }
  else if (el.dataset.f === 'dur'){ pushHistory(focusSnap); x.dur = Math.max(0, Math.round(+el.value || 0)); }
  else return;
  focusSnap = snap(); save(); render();
});
document.addEventListener('keydown', e => {
  const el = e.target; if (e.key !== 'Enter') return;
  if (el.dataset.newtodo){ e.preventDefault(); const v = el.value.trim(); if (v) commit(() => find(el.dataset.newtodo).todos.push({id:uid(), text:v, done:false})); }
  else if (el.dataset.newcom){ e.preventDefault(); addComment(el.dataset.newcom); }
  else if (el.hasAttribute('data-qnew')){ e.preventDefault(); const v = el.value.trim(); if (v) commit(() => state.questions.push({id:uid(), text:v, done:false})); }
  else if (el.dataset.f === 'title' || el.dataset.todo || el.dataset.qtext){ e.preventDefault(); el.blur(); }
});

/* ---------- Ziehen & Ablegen ---------- */
let dragId = null;
tl.addEventListener('mousedown', e => { const g = e.target.closest('[data-grip]'); if (g) g.closest('.row').draggable = true; });
tl.addEventListener('dragstart', e => { const row = e.target.closest('.row'); if (!row) return; dragId = row.dataset.id; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
tl.addEventListener('dragend', () => { dragId = null; tl.querySelectorAll('.row').forEach(r => { r.classList.remove('dragging', 'drop-before', 'drop-after'); r.draggable = false; }); });
tl.addEventListener('dragover', e => {
  const row = e.target.closest('.row'); if (!dragId || !row || row.dataset.id === dragId) return;
  e.preventDefault(); const rc = row.getBoundingClientRect(), after = e.clientY > rc.top + rc.height / 2;
  tl.querySelectorAll('.row').forEach(r => r.classList.remove('drop-before', 'drop-after'));
  row.classList.add(after ? 'drop-after' : 'drop-before');
});
tl.addEventListener('drop', e => {
  const row = e.target.closest('.row'); if (!dragId || !row || row.dataset.id === dragId) return; e.preventDefault();
  const after = row.classList.contains('drop-after'), target = row.dataset.id, moving = dragId;
  commit(() => { const [m] = state.items.splice(idx(moving), 1); state.items.splice(idx(target) + (after ? 1 : 0), 0, m); });
});

/* ---------- Toast ---------- */
let toastT;
function toast(msg, withUndo){
  $('#toastMsg').textContent = msg; $('#toastBtn').hidden = !withUndo;
  $('#toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('show'), 5000);
}
$('#toastBtn').onclick = () => { undo(); $('#toast').classList.remove('show'); };

/* ---------- Menü ---------- */
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('[data-menu]'); if (!b) return;
  const m = b.dataset.menu;
  if (m === 'reset'){ e.stopPropagation(); armed(b, 'Sicher? Nochmal klicken', () => { $('#menu').hidden = true; commit(() => { state = fresh(); openId = null; }, 'Zurückgesetzt'); }); return; }
  $('#menu').hidden = true;
  if (m === 'export'){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'ablaufplan-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Datei gesichert');
  }
  if (m === 'import') $('#fileIn').click();
  if (m === 'print') window.print();
  if (m === 'copy'){
    const {res} = compute();
    let md = `# ${state.meta.title}\n\n| Zeit | Punkt | Notizen |\n|---|---|---|\n`;
    state.items.forEach(x => {
      const r = res[x.id];
      const bits = [x.location, x.person && 'Wer: ' + x.person, x.details.replace(/\n/g, ' '), x.todos.map(t => (t.done ? '☑ ' : '☐ ') + t.text).join(', '), x.tentative && '_vorläufig_'].filter(Boolean).join(' · ');
      md += `| ${hhmm(r.start)}–${hhmm(r.end)} | ${x.parallel ? '↳ ' : ''}**${x.title}** | ${bits.replace(/\|/g, '/')} |\n`;
    });
    if (state.questions.length) md += `\n## Offene Fragen\n\n` + state.questions.map(q => `- [${q.done ? 'x' : ' '}] ${q.text}`).join('\n') + '\n';
    navigator.clipboard.writeText(md).then(() => toast('Als Markdown kopiert'), () => toast('Kopieren nicht möglich'));
  }
});
$('#fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); if (!Array.isArray(d.items)) throw 0; commit(() => { state = normalize(d); openId = null; }, 'Datei geladen'); })
    .catch(() => toast('Das ist keine gültige Ablaufplan-Datei')); e.target.value = '';
};

render();
})();
</script>
</body>
