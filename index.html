<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hochzeit · Ablaufplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffffe; --ink:#111; --ink-2:#444; --muted:#8a8780; --rule:#ebe8e2; --rule-2:#d6d1c7; --soft:#f6f4f0;
  --err:#b0303f; --err-bg:#fcecee; --warn:#8a6a1f; --warn-bg:#fbf5e4; --ok:#48663a; --ok-bg:#eef4e8;
  --serif:"EB Garamond",Garamond,"Times New Roman",serif;
  --sans:"Jost","Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
}
[data-c="rose"]{--c:#d9909c;--cb:#fbeef0;--ci:#8f3f4c}
[data-c="apricot"]{--c:#e2a476;--cb:#fdf1e7;--ci:#8f4f22}
[data-c="butter"]{--c:#d7bb5c;--cb:#fbf5df;--ci:#7a5e12}
[data-c="sage"]{--c:#8fae78;--cb:#eff5ea;--ci:#46652f}
[data-c="sky"]{--c:#82a7cb;--cb:#edf3f9;--ci:#375a7c}
[data-c="lavender"]{--c:#a996d0;--cb:#f3f0fa;--ci:#5a4884}
[data-c="stone"]{--c:#b5afa4;--cb:#f5f3ef;--ci:#57534c}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--serif);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;padding:0 20px 60px;font-variant-numeric:tabular-nums lining-nums}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto}
.sans{font-family:var(--sans)}

/* Kopf */
header{padding:28px 0 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
h1{font-weight:500;font-size:30px;margin:0}
.sub{font-style:italic;color:var(--ink-2);font-size:18px}
[contenteditable]{outline:none;border-radius:3px}
[contenteditable]:hover,[contenteditable]:focus{background:var(--soft)}
.overview{font-family:var(--sans);font-weight:300;font-size:13px;color:var(--ink-2);width:100%}

/* Leiste */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,254,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding:8px 0}
.toolbar .wrap{display:flex;gap:8px;align-items:center;position:relative}
.btn{font-family:var(--sans);font-weight:400;font-size:13px;background:#fff;border:1px solid var(--rule-2);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default;border-color:var(--rule-2)}
.btn.danger{color:var(--err);border-color:#ecc6cb}
.btn.danger.armed{background:var(--err);color:#fff;border-color:var(--err)}
.spacer{flex:1}
.sync{font-family:var(--sans);font-size:12.5px;color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--ok)} .sync.err{color:var(--err)}
.status{font-family:var(--sans);font-size:13px;border:0;border-radius:6px;padding:6px 11px;cursor:pointer}
.status.ok{background:var(--ok-bg);color:var(--ok)} .status.warn{background:var(--warn-bg);color:var(--warn)} .status.err{background:var(--err-bg);color:var(--err)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--rule-2);border-radius:8px;box-shadow:0 12px 30px -14px rgba(0,0,0,.3);padding:4px;min-width:220px;font-family:var(--sans);font-size:14px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px}
.menu .danger{color:var(--err)}
.issues{font-family:var(--sans);font-size:13.5px;margin-top:8px;border-top:1px solid var(--rule)}
.issues div{padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer;display:flex;gap:8px}
.issues div:hover span:last-child{text-decoration:underline}
.issues .lv{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn)}
.issues .lv.err{background:var(--err)}

/* Raster */
.scroller{overflow-x:auto;margin-top:14px;-webkit-overflow-scrolling:touch}
.grid{display:grid;position:relative;min-width:100%}
.hdr{position:sticky;top:0;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px;border-bottom:1px solid var(--ink);align-self:end;background:var(--bg);z-index:3}
.hdr.par{border-left:1px solid var(--rule)}
.rule{grid-column:1 / -1;border-top:1px solid var(--rule);pointer-events:none}
.rule.hour{border-top-color:var(--rule-2)}
.tlabel{grid-column:1;font-size:15px;padding:3px 10px 0 0;text-align:right;color:var(--ink);position:sticky;left:0;background:var(--bg);z-index:2}
.tlabel.minor{color:var(--muted);font-size:13.5px}
.lanesep{border-left:1px solid var(--rule);pointer-events:none}
.blk{margin:2px 3px;padding:3px 7px 4px 8px;background:var(--cb);border-left:3px solid var(--c);cursor:pointer;overflow:hidden;position:relative;z-index:1;min-width:0}
.blk:hover{outline:1px solid var(--c)}
.blk.sel{outline:2px solid var(--ink);outline-offset:0}
.blk.tent{border-left-style:dashed;background:linear-gradient(90deg,var(--cb),#fff)}
.blk.err{outline:2px solid var(--err)}
.blk .t{font-weight:500;font-size:16px;line-height:1.2}
.blk .m{font-family:var(--sans);font-weight:300;font-size:12px;color:var(--ink-2);margin-top:1px}
.blk .m b{font-weight:400;color:var(--ci)}
.blk .loc{color:var(--ink);font-weight:400}
.blk .g{font-family:var(--sans);font-weight:300;font-size:12px;color:var(--ink-2);margin-top:2px}
.blk .g b{font-weight:500;color:var(--ci)}
.blk .n{font-size:13.5px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,2);overflow:hidden;font-style:italic}
.blk.zero{padding-top:2px;padding-bottom:2px}
.free{margin:2px 3px;border:1px dashed var(--rule-2);display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--sans);font-size:12px;color:var(--muted);cursor:pointer;background:transparent;text-align:left}
.free:hover{border-color:var(--ink);color:var(--ink)}
.legend{font-family:var(--sans);font-weight:300;font-size:12px;color:var(--muted);margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px}
.legend i{display:inline-block;width:18px;height:10px;vertical-align:-1px;margin-right:5px;background:#eee;border-left:3px solid #999}
.legend i.tent{border-left-style:dashed;background:linear-gradient(90deg,#eee,#fff)}

/* Seitenfeld */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;border-left:1px solid var(--rule-2);box-shadow:-18px 0 40px -30px rgba(0,0,0,.4);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--rule);border-top:4px solid var(--c)}
.dhead .ttl{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:1}
.dbody{overflow-y:auto;padding:16px 18px 30px;flex:1}
.dfoot{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.fld{margin-bottom:15px}
.lbl{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--rule-2);background:#fff;border-radius:6px;padding:7px 10px;font-family:var(--sans);font-weight:400;font-size:14.5px}
.inp:focus{outline:none;border-color:var(--ink)}
.inp.big{font-family:var(--serif);font-size:21px;font-weight:500;padding:5px 10px}
textarea.inp{resize:vertical;min-height:80px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden;font-family:var(--sans);font-size:13px}
.seg button{border:0;background:#fff;padding:6px 11px;cursor:pointer;border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-family:var(--sans);font-size:13.5px;color:var(--ink-2)}
.row input[type=time]{width:120px}
.row input[type=number]{width:80px}
.rnd{width:30px;height:30px;border-radius:6px;border:1px solid var(--rule-2);background:#fff;cursor:pointer}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px var(--rule-2);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.chk{display:inline-flex;gap:8px;align-items:center;font-family:var(--sans);font-size:14px;cursor:pointer}
.cb{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid var(--ink);border-radius:4px;margin:0;display:grid;place-content:center;cursor:pointer;flex:none;background:#fff}
.cb:checked{background:var(--ink)}
.cb:checked:after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;padding:2px 6px}
.x:hover{color:var(--err)}
.plus{width:17px;text-align:center;color:var(--muted)}
.comment{padding:8px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;font-family:var(--sans);font-size:14px}
.comment .who{font-size:12px;font-weight:500}
.comment .who span{color:var(--muted);font-weight:300;margin-left:6px}
.comment .txt{grid-column:1 / -1;white-space:pre-wrap}
.newc{display:grid;grid-template-columns:110px 1fr auto;gap:6px;margin-top:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.12);z-index:35}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:9px 10px 9px 16px;border-radius:8px;font-family:var(--sans);font-size:13.5px;display:flex;gap:12px;align-items:center;transition:all .2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:#fff;color:var(--ink);border:0;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12.5px}
footer{font-family:var(--sans);font-weight:300;font-size:12px;color:var(--muted);margin-top:26px}

@media (max-width:640px){
  body{padding:0 12px 60px}
  .two,.newc{grid-template-columns:1fr}
  .hide-sm{display:none}
  .drawer{top:auto;height:88vh;width:100%;border-left:0;border-top:1px solid var(--rule-2);transform:translateY(100%);border-radius:12px 12px 0 0}
  .blk .t{font-size:15px}
}
@media print{
  .toolbar,.drawer,.scrim,.toast,footer,.free{display:none!important}
  body{padding:0}
  .scroller{overflow:visible}
}
</style>
</head>
<body>

<header class="wrap">
  <h1 contenteditable="true" data-meta="title"></h1>
  <span class="sub" contenteditable="true" data-meta="subtitle"></span>
  <div class="overview" id="overview"></div>
</header>

<nav class="toolbar">
  <div class="wrap">
    <button class="btn primary" id="addBtn">+ Neuer Punkt</button>
    <button class="btn" id="undoBtn" title="Rückgängig (⌘Z)">↶<span class="hide-sm"> Rückgängig</span></button>
    <span class="spacer"></span>
    <span class="sync busy" id="sync">Lokal</span>
    <button class="status ok" id="statusBtn"></button>
    <button class="btn" id="menuBtn" title="Mehr">•••</button>
    <div class="menu" id="menu" hidden>
      <button data-menu="export">Als Datei sichern</button>
      <button data-menu="import">Datei laden (ersetzt für alle)</button>
      <button data-menu="copy">Als Text kopieren</button>
      <button data-menu="print">Drucken</button>
      <hr>
      <button data-menu="reset" class="danger">Für alle auf Anfang zurücksetzen</button>
    </div>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
  </div>
  <div class="wrap"><div class="issues" id="issues" hidden></div></div>
</nav>

<main class="wrap">
  <div class="scroller"><div class="grid" id="grid"></div></div>
  <div class="legend">
    <span><i></i>fester Programmpunkt</span>
    <span><i class="tent"></i>vorläufig</span>
    <span>Zeilenhöhe wächst mit der Dauer</span>
    <span>Klick auf einen Punkt öffnet ihn</span>
  </div>
</main>

<footer class="wrap">Änderungen werden live für alle gespeichert, die diesen Link öffnen. Texte werden gespeichert, sobald du das Feld verlässt. Sicherheitskopie: ••• → „Als Datei sichern“.</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Programmpunkt bearbeiten"></aside>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">Rückgängig</button></div>

<script type="module">
(() => {
'use strict';
const SEED = {"meta": {"title": "Hochzeit", "subtitle": "Ablauf fürs Planungsteam · 17.10.2026"}, "author": "", "items": [{"title": "Frühstück", "color": "butter", "fixed": true, "time": "07:00", "dur": 30, "tentative": true, "details": "Uhrzeit steht nicht auf dem Zettel – bitte festlegen.", "id": "p1"}, {"title": "Get Ready", "color": "sky", "fixed": true, "time": "07:30", "until": "next", "id": "p2"}, {"title": "First Look", "color": "rose", "fixed": true, "time": "11:45", "dur": 20, "tentative": true, "id": "p3"}, {"title": "Fotoshoot", "color": "rose", "until": "next", "details": "Paar-Shooting direkt nach dem First Look.", "id": "p4"}, {"title": "Einlauf der Braut", "color": "butter", "fixed": true, "time": "12:55", "dur": 5, "id": "p5"}, {"title": "Trauung", "color": "sage", "fixed": true, "time": "13:00", "until": "next", "location": "Kirche", "details": "Musik: nur Chor und Klavier, kein Orchester.\nOffen: Gäste informieren, dass sie ihr Zimmer in der Location erst später beziehen?", "id": "p6"}, {"title": "Kuchen", "color": "apricot", "fixed": true, "time": "14:00", "until": "next", "id": "p7"}, {"title": "Abfahrt Schloss", "color": "butter", "fixed": true, "time": "15:00", "dur": 30, "id": "p8"}, {"title": "Fotoshoot", "color": "rose", "fixed": true, "time": "16:00", "until": "next", "location": "Schloss", "id": "p9"}, {"title": "Chaoskarten verteilen", "color": "butter", "parallel": true, "until": "next", "details": "Während das Paar beim Shooting ist. Karten sind gekauft und individualisiert.", "id": "p10"}, {"title": "Empfang Schloss", "color": "sky", "fixed": true, "time": "16:30", "until": "next", "location": "Schloss", "details": "Rückkehr vom Shooting: Begrüßung und Jubel.\nOffen: Wie jubeln wir? Idee: Fanfare zur Anfahrt, Verlesen wie im Adel.\nHochprozentiges kommt vom Schloss.", "id": "p11"}, {"title": "Puzzlespiel zum Kennenlernen", "color": "sky", "parallel": true, "until": "next", "details": "Statt Fotobox: Alle bekommen ein Puzzleteil, suchen die passenden Personen und kommen ins Gespräch. Der Fotograf macht das Gruppenfoto.\nPuzzlestücke passend zur Gästezahl, Fotograf briefen.", "id": "p12"}, {"title": "Kleine Rede mit Vorstellung", "color": "apricot", "fixed": true, "time": "17:00", "dur": 20, "tentative": true, "id": "p13"}, {"title": "Gästebuch-Leinwand", "color": "sage", "parallel": true, "until": "end", "details": "Kreatives Gästebuch: große Leinwand, jede*r malt einen Strich in verschiedenen Grüntönen (für die nackten Wände). Braucht eine Staffelei.", "id": "p14", "gear": "Staffelei"}, {"title": "Fotoaufgaben & Gäste-Collage", "color": "rose", "parallel": true, "until": "end", "details": "Fotoaufgaben liegen auf den Stühlen. Puzzle-Personen wiederfinden und fotografieren. Daraus entsteht die Gäste-Collage.", "id": "p15", "gear": "Puzzles liegen auf den Plätzen"}, {"title": "Ideen (offen): Tattoo-Station", "color": "stone", "parallel": true, "until": "end", "tentative": true, "details": "Tattoos mit Motiven vom Paar – schön und lustig (Köpfe, Familienwappen …). Kosten klären.", "id": "p16"}, {"title": "Ideen (offen): 10 Gläser", "color": "stone", "parallel": true, "until": "end", "tentative": true, "details": "Ein Glas pro Hochzeitstag bis zum 10. Zettel und Stifte daneben – Gäste schreiben Wünsche, Witze, Gedanken für das jeweilige Jahr.", "id": "p17"}, {"title": "Ideen (offen): Fotoecke mit Kinderbildern", "color": "stone", "parallel": true, "until": "end", "tentative": true, "details": "Anfrage beim Paar läuft, ob sie das wollen.", "id": "p18"}, {"title": "Flugbegleiter-Einführung", "color": "lavender", "fixed": true, "time": "18:45", "dur": 15, "tentative": true, "details": "Wenn alle sitzen, vor dem Essen.", "id": "p19", "gear": "Mikro (durch DJ)"}, {"title": "Vorspeise", "color": "sage", "fixed": true, "time": "19:00", "dur": 40, "tentative": true, "details": "Kein Programm während des Essens – nur zwischen den Gängen.", "id": "p20"}, {"title": "Audio-Gästebuch (QR-Codes)", "color": "sky", "parallel": true, "until": "end", "details": "QR-Codes (Hochzeitsedition) auf den Tischen verteilt, zusammen mit Fotoaufgaben. Paket ist gebucht.", "id": "p21"}, {"title": "Spieltisch", "color": "butter", "parallel": true, "until": "end", "tentative": true, "details": "Steht auf dem Zettel bei den Parallel-Aktionen zum Dinner.", "id": "p22"}, {"title": "Sandmalerei", "color": "lavender", "dur": 15, "tentative": true, "details": "Zwischen Vorspeise und Hauptgang (alternativ nach dem Dessert).", "id": "p23", "gear": "Fernseher und Audioanschluss (durch DJ)"}, {"title": "Hauptgang", "color": "sage", "dur": 60, "tentative": true, "id": "p24"}, {"title": "Video-Quiz", "color": "lavender", "dur": 20, "details": "Max. 20 Minuten. Rote Linie: die Geschichte der Kiste.\nVorgaben allgemein: Format, Länge. Pro Szene drei Antwortmöglichkeiten.\nSchatzkiste für den ersten Hochzeitstag wird Teil des Videos; Gäste bringen Mitbringsel mit (Brief, Einladung, Geschenke).", "id": "p25", "gear": "Fernseher und Audioanschluss (durch DJ), Mikro"}, {"title": "Dessert", "color": "sage", "dur": 30, "tentative": true, "id": "p26"}, {"title": "Party", "color": "apricot", "until": "next", "tentative": true, "details": "Steht nicht auf dem Zettel – Platzhalter bis zum Schluss.\nOffen: Wie kommt Partystimmung auf? Jede*r bekommt etwas in die Hand – aber was?", "id": "p27"}, {"title": "Schluss", "color": "rose", "fixed": true, "time": "02:30", "dur": 0, "id": "p28"}]};
const KEY = 'hochzeit-ablauf-v3';
const COLORS = [['rose','Rosé'],['apricot','Apricot'],['butter','Champagner'],['sage','Salbei'],['sky','Taubenblau'],['lavender','Lavendel'],['stone','Neutral']];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

/* ---------- Zustand ---------- */
function blank(o = {}){
  const x = Object.assign({id:uid(), title:'', color:'sage', fixed:false, time:'', dur:30, until:'min', parallel:false, tentative:false, location:'', person:'', details:'', comments:[]}, o);
  // alte Checklisten in die Notizen übernehmen
  if (Array.isArray(x.todos) && x.todos.length) x.details = [x.details, ...x.todos.map(t => '– ' + t.text)].filter(Boolean).join('\n');
  delete x.todos;
  if (o.until == null && o.auto != null) x.until = o.auto ? 'next' : 'min';
  delete x.auto;
  if (!x.parallel && x.until === 'end') x.until = 'min';
  // fehlendes Kennzeichen „nach Mitternacht“ aus der Uhrzeit ableiten (vor 05:00 = Folgetag)
  if (typeof x.nextDay !== 'boolean'){ const tm = /^(\d{1,2}):(\d{2})$/.exec(x.time || ''); x.nextDay = !!tm && +tm[1] * 60 + +tm[2] < 300; }
  return x;
}
function normalize(s){
  s.meta = Object.assign({title:'Hochzeit', subtitle:''}, s.meta || {});
  s.items = (s.items || []).map(blank);
  s.author = s.author || '';
  delete s.questions;
  return s;
}
const fresh = () => normalize(JSON.parse(JSON.stringify(SEED || {items:[]})));
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
state = state && Array.isArray(state.items) ? normalize(state) : fresh();

let openId = null, issuesOpen = false, focusSnap = null;

const COL = 'ablaufplan';
let fb = null, loaded = false, synced = {};   // synced: Dokument-ID -> zuletzt bekannter Stand
const stable = v => JSON.stringify(v, (k, val) => val && typeof val === 'object' && !Array.isArray(val) ? Object.fromEntries(Object.keys(val).sort().map(key => [key, val[key]])) : val);
function docsOf(s){
  const out = {meta:{title:s.meta.title || '', subtitle:s.meta.subtitle || '', order:s.items.map(x => x.id)}};
  s.items.forEach(x => { out['item_' + x.id] = x; });
  return out;
}
function setSync(kind, text){ const el = $('#sync'); if (el){ el.className = 'sync ' + kind; el.textContent = text; } }
// Schreibt nur geänderte Felder, damit gleichzeitige Änderungen anderer erhalten bleiben
function pushSync(){
  if (!fb || !loaded) return;
  const {doc, writeBatch, deleteField} = fb.fn;
  const cur = docsOf(state), batch = writeBatch(fb.db); let n = 0;
  for (const [k, v] of Object.entries(cur)){
    const js = stable(v); if (synced[k] === js) continue;
    const prev = synced[k] ? JSON.parse(synced[k]) : null;
    if (!prev) batch.set(doc(fb.db, COL, k), v);
    else {
      const ch = {};
      new Set([...Object.keys(v), ...Object.keys(prev)]).forEach(f => { if (stable(v[f]) !== stable(prev[f])) ch[f] = v[f] === undefined ? deleteField() : v[f]; });
      batch.set(doc(fb.db, COL, k), ch, {merge:true});
    }
    synced[k] = js; n++;
  }
  Object.keys(synced).forEach(k => { if (!(k in cur)){ batch.delete(doc(fb.db, COL, k)); delete synced[k]; n++; } });
  if (!n) return;
  setSync('busy', 'Speichert …');
  batch.commit().then(() => setSync('ok', '● Live')).catch(err => { console.error(err); synced = {}; setSync('err', 'Nicht gespeichert'); });
}
function applyRemote(snap){
  const docs = {}; snap.forEach(d => { docs[d.id] = d.data(); });
  if (!docs.meta){
    // leerer Speicher: aktuellen Stand als Startstand hochladen
    if (!snap.metadata.fromCache && !loaded){ loaded = true; synced = {}; pushSync(); }
    return;
  }
  loaded = true;
  synced = {}; Object.entries(docs).forEach(([k, v]) => { synced[k] = stable(v); });
  const order = docs.meta.order || [];
  const pos = id => { const i = order.indexOf(id); return i < 0 ? 1e9 : i; };
  const items = Object.keys(docs).filter(k => k.startsWith('item_')).map(k => docs[k]).sort((a, b) => pos(a.id) - pos(b.id));
  const author = state.author;
  state = normalize({meta:{title:docs.meta.title, subtitle:docs.meta.subtitle}, items});
  state.author = author;
  if (dirty){ const x = find(dirty.id); if (x) x[dirty.f] = dirty.v; }
  if (openId && !find(openId)) openId = null;
  saveLocal(); render();
  if (!snap.metadata.hasPendingWrites) setSync(snap.metadata.fromCache ? 'busy' : 'ok', snap.metadata.fromCache ? 'Verbinde …' : '● Live');
}

/* ---------- Zeitrechnung ---------- */
const toMin = hm => { const m = /^(\d{1,2}):(\d{2})$/.exec(hm || ''); return m ? +m[1] * 60 + +m[2] : null; };
// Uhrzeiten vor Tagesbeginn (erster fester Punkt) zählen als nach Mitternacht
// Feste Uhrzeit + Kennzeichen „nach Mitternacht“. Neu eingegebene Zeiten vor 05:00 gelten zunächst als Folgetag.
const NIGHT = 5 * 60;
const abs = x => { const m = toMin(x.time); return m == null ? null : m + (x.nextDay ? 1440 : 0); };
function setTime(x, hm){ x.time = hm; x.nextDay = toMin(hm) < NIGHT; }
const pad = n => String(n).padStart(2, '0');
const hhmm = m => m == null ? '–' : (d => pad(Math.floor(d / 60)) + ':' + pad(d % 60))(((m % 1440) + 1440) % 1440);
function fmtDur(d){ if (d == null) return '–'; if (d <= 0) return '0 Min.'; const h = Math.floor(d / 60), m = d % 60; return [h && h + ' Std.', m && m + ' Min.'].filter(Boolean).join(' '); }
const T = x => x.title || 'Ohne Titel';

function compute(){
  const items = state.items, res = {}, issues = [];
  const add = (level, id, text) => issues.push({level, id, text});
  const mainIdx = items.map((x, i) => x.parallel ? -1 : i).filter(i => i >= 0);
  const firstMain = items.find(x => !x.parallel);
  let prevEnd = null, prev = null;
  items.forEach((x, i) => {
    if (x.parallel) return;
    const r = res[x.id] = {gap:0};
    if (x.fixed && toMin(x.time) != null){
      r.start = abs(x);
      if (prevEnd != null){ r.gap = r.start - prevEnd; if (r.gap < 0) add('err', x.id, `„${T(x)}“ beginnt ${fmtDur(-r.gap)} bevor „${T(prev)}“ endet`); }
    } else if (prevEnd == null){ r.start = 8 * 60; add('err', x.id, 'Der erste Punkt braucht eine feste Uhrzeit'); }
    else r.start = prevEnd;
    let dur = +x.dur || 0;
    if (x.until === 'next'){
      const nx = items[mainIdx.find(j => j > i)];
      if (nx && nx.fixed && toMin(nx.time) != null){ dur = abs(nx) - r.start; r.to = T(nx); }
      else { dur = 0; add('warn', x.id, `„${T(x)}“ läuft bis zum nächsten Punkt – der hat aber keine feste Uhrzeit`); }
    }
    if (dur < 0){ add('err', x.id, `„${T(x)}“ endet, bevor es beginnt`); dur = 0; }
    r.dur = dur; r.end = r.start + dur; prevEnd = r.end; prev = x;
  });
  const lastEnd = prevEnd;
  let parent = null;
  items.forEach((x, i) => {
    if (!x.parallel){ parent = x; return; }
    const r = res[x.id] = {gap:0};
    if (!parent){ r.start = 8 * 60; add('err', x.id, `„${T(x)}“ läuft nebenher, aber es gibt davor keinen Hauptpunkt`); }
    else { r.parentId = parent.id; r.start = x.fixed && toMin(x.time) != null ? abs(x) : res[parent.id].start; }
    let dur = +x.dur || 0;
    if (x.until === 'next'){ const nx = items.slice(i + 1).find(y => !y.parallel); dur = nx ? res[nx.id].start - r.start : 0; }
    if (x.until === 'end') dur = (lastEnd ?? r.start) - r.start;
    r.dur = Math.max(0, dur); r.end = r.start + r.dur;
  });
  items.forEach(x => { if (!x.title.trim()) add('warn', x.id, 'Ein Punkt hat noch keinen Titel'); });
  const mains = items.filter(x => !x.parallel);
  const first = mains.length ? res[mains[0].id].start : null;
  return {res, issues, first, last:lastEnd};
}

/* ---------- Raster ---------- */
function layout(res){
  const items = state.items;
  const bset = new Set(), zeroAt = new Set();
  items.forEach(x => { const r = res[x.id]; bset.add(r.start); bset.add(r.end); if (r.end === r.start) zeroAt.add(r.start); });
  const B = [...bset].sort((a, b) => a - b);
  const rows = [], firstRow = {};
  B.forEach((t, k) => {
    if (zeroAt.has(t)){ firstRow[t] ??= rows.length; rows.push({start:t, end:t, zero:true}); }
    if (k < B.length - 1){ firstRow[t] ??= rows.length; rows.push({start:t, end:B[k + 1]}); }
  });
  const lastT = B[B.length - 1];
  if (firstRow[lastT] == null){ firstRow[lastT] = rows.length; rows.push({start:lastT, end:lastT, tail:true}); }
  const span = x => { const r = res[x.id]; const a = firstRow[r.start]; const b = r.end === r.start ? a + 1 : firstRow[r.end]; return [a, Math.max(b, a + 1)]; };
  const place = list => {
    const lanes = [], out = [];
    list.map(x => ({x, s:span(x)})).sort((p, q) => p.s[0] - q.s[0] || (q.s[1] - q.s[0]) - (p.s[1] - p.s[0]))
      .forEach(p => { let l = lanes.findIndex(end => end <= p.s[0]); if (l < 0){ l = lanes.length; lanes.push(0); } lanes[l] = p.s[1]; out.push({...p, lane:l}); });
    return {n:lanes.length, out};
  };
  const main = place(items.filter(x => !x.parallel));
  const par = place(items.filter(x => x.parallel));
  // Lücken im Hauptprogramm
  const covered = new Array(rows.length).fill(false);
  main.out.forEach(p => { for (let r = p.s[0]; r < p.s[1]; r++) covered[r] = true; });
  const gaps = [];
  for (let r = 0; r < rows.length; r++){
    if (covered[r] || rows[r].tail || rows[r].zero) continue;
    let e = r; while (e + 1 < rows.length && !covered[e + 1] && !rows[e + 1].tail && !rows[e + 1].zero) e++;
    const t0 = rows[r].start, t1 = rows[e].end;
    const next = items.find(x => !x.parallel && res[x.id].start >= t1);
    if (t1 > t0) gaps.push({a:r, b:e + 1, dur:t1 - t0, nextId:next?.id});
    r = e;
  }
  return {rows, main, par, gaps};
}

function renderGrid({res, issues}){

  const {rows, main, par, gaps} = layout(res);
  const mainCols = Math.max(1, main.n), parCols = par.n;
  const tw = 58;
  g.style.gridTemplateColumns = `${tw}px repeat(${mainCols}, minmax(170px, 1.6fr))` + (parCols ? ` repeat(${parCols}, minmax(118px, 1fr))` : '');
  g.style.gridTemplateRows = 'auto ' + rows.map(r => r.tail ? '26px' : r.zero ? 'minmax(30px, auto)' : `minmax(${Math.round(Math.min(130, Math.max(30, 16 + (r.end - r.start) * 0.42)))}px, auto)`).join(' ');

    return `<div class="blk${zero ? ' zero' : ''}${x.tentative ? ' tent' : ''}${my ? ' err' : ''}${openId === x.id ? ' sel' : ''}" data-c="${esc(x.color)}" data-open="${x.id}"
      style="grid-column:${col};grid-row:${R(p.s[0])} / ${R(p.s[1])};--lines:${lines}" title="${esc(x.details)}">
      <div class="t">${esc(x.title) || '<span style="color:var(--muted)">Ohne Titel</span>'}</div>
      <div class="m"><b>${hhmm(r.start)}${zero ? '' : '–' + hhmm(r.end)}</b>${zero ? '' : ' · ' + fmtDur(r.dur)}${loc}${x.tentative ? ' · <i>vorläufig</i>' : ''}${who}${com}</div>

/* ---------- Aktionen ---------- */
const find = id => state.items.find(x => x.id === id);
const idx = id => state.items.findIndex(x => x.id === id);
// Hauptpunkt + direkt folgende Parallelpunkte
function groupRange(i){ let e = i + 1; while (e < state.items.length && state.items[e].parallel) e++; return [i, e]; }
// Punkt mit fester Uhrzeit an die zeitlich passende Stelle verschieben (Hauptpunkte samt ihrer Parallelpunkte)
function placeByTime(x){
  if (!x.fixed || toMin(x.time) == null) return;
  const t = abs(x);
  if (x.parallel){
    const [m] = state.items.splice(idx(x.id), 1);
    const {res} = compute();
    const mains = state.items.filter(y => !y.parallel);
    if (!mains.length){ state.items.push(m); return; }
    let parent = mains[0];
    mains.forEach(y => { if (res[y.id].start <= t) parent = y; });
    state.items.splice(groupRange(idx(parent.id))[1], 0, m);
    return;
  }
  const [s, e] = groupRange(idx(x.id));
  const grp = state.items.splice(s, e - s);
  const {res} = compute();
  const next = state.items.find(y => !y.parallel && res[y.id].start > t);
  state.items.splice(next ? idx(next.id) : state.items.length, 0, ...grp);
}
function openItem(id, focusTitle){
  openId = id; render();
  document.querySelector(`[data-open="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'nearest'});
  if (focusTitle) setTimeout(() => document.querySelector(`[data-k="${id}:title"]`)?.focus(), 220);
}
function armed(b, label, fn){
  if (!b.classList.contains('armed')){ b.classList.add('armed'); const old = b.textContent; b.textContent = label; setTimeout(() => { if (b.isConnected){ b.classList.remove('armed'); b.textContent = old; } }, 3000); return; }
  fn();
}
function close(){ openId = null; document.activeElement?.blur(); render(); }

$('#addBtn').onclick = () => {
  const ref = openId ? find(openId) : null;
  const n = blank({color: ref ? ref.color : 'sage'});
  commit(() => {
    if (!ref) return state.items.push(n);
    const i = idx(ref.id);
    state.items.splice(ref.parallel ? i + 1 : groupRange(i)[1], 0, n);
  });
  openItem(n.id, true);
};
$('#undoBtn').onclick = undo;
$('#statusBtn').onclick = () => { if (!$('#issues').innerHTML) return; issuesOpen = !issuesOpen; render(); };
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; };
$('#scrim').onclick = close;
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('#menu').hidden = true; });
document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) && !document.activeElement?.isContentEditable){ e.preventDefault(); undo(); }
  if (e.key === 'Escape'){ $('#menu').hidden = true; if (openId) close(); }
});

document.querySelectorAll('[data-meta]').forEach(el => {
  el.addEventListener('focus', () => { focusSnap = snap(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
  el.addEventListener('blur', () => { const v = el.textContent.trim(); if (v !== state.meta[el.dataset.meta]){ pushHistory(focusSnap); state.meta[el.dataset.meta] = v; save(); render(); } });
});

document.addEventListener('click', e => {
  const jump = e.target.closest('[data-jump]');
  if (jump){ issuesOpen = false; openItem(jump.dataset.jump); return; }
  const o = e.target.closest('[data-open]');
  if (o){ openItem(o.dataset.open); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.type === 'checkbox') return;
  const id = b.dataset.id, x = find(id), a = b.dataset.act;
  switch (a){
    case 'close': close(); break;
    case 'set': commit(() => {
      const f = b.dataset.f, raw = b.dataset.v, v = raw === 'true' ? true : raw === 'false' ? false : raw;
      const r = compute().res[id];
      if (f === 'fixed' && v && !x.time){ x.time = hhmm(r.start); x.nextDay = r.start >= 1440; }
      if (f === 'until' && v === 'min') x.dur = Math.max(0, r.dur);
      if (f === 'parallel'){
        const i = idx(id);
        if (v){ // an den vorigen Hauptpunkt hängen
          if (x.until === 'min' && !x.dur) x.dur = 30;
          x.fixed = false;
        } else {
          if (x.until === 'end') x.until = 'min';
          x.dur = x.until === 'min' ? Math.max(5, r.dur) : 30; x.until = 'min'; x.fixed = true; x.time = hhmm(r.start); x.nextDay = r.start >= 1440;
          const [m] = state.items.splice(i, 1);  // hinter die Gruppe verschieben
          let j = i; while (j < state.items.length && state.items[j].parallel) j++;
          state.items.splice(j, 0, m); x[f] = v; return;
        }
      }
      x[f] = v;
      if (f === 'fixed' && v) placeByTime(x);
    }); break;
    case 'color': commit(() => { x.color = b.dataset.v; }); break;
    case 'step': commit(() => { x.dur = Math.max(0, (+x.dur || 0) + +b.dataset.d); }); break;
    case 'move': commit(() => {
      const i = idx(id), [s, e2] = groupRange(i), grp = state.items.slice(s, e2);
      if (+b.dataset.d < 0){
        let p = s - 1; while (p >= 0 && state.items[p].parallel) p--; if (p < 0) return;
        state.items.splice(s, grp.length); state.items.splice(p, 0, ...grp);
      } else {
        if (e2 >= state.items.length) return;
        const [, ne] = groupRange(e2);
        state.items.splice(s, grp.length); state.items.splice(ne - grp.length, 0, ...grp);
      }
    }); break;
    case 'dup': { const c = JSON.parse(JSON.stringify(x)); Object.assign(c, {id:uid(), title:x.title + ' (Kopie)', comments:[]}); if (!c.parallel) c.fixed = false; commit(() => state.items.splice(x.parallel ? idx(id) + 1 : groupRange(idx(id))[1], 0, c)); openItem(c.id, true); break; }
    case 'del': armed(b, 'Wirklich löschen?', () => commit(() => { state.items.splice(idx(id), 1); openId = null; }, `„${T(x)}“ gelöscht`)); break;
    case 'fillgap': {
      const n = blank({dur:+b.dataset.gap});
      commit(() => { const j = id ? idx(id) : state.items.length; state.items.splice(j, 0, n); });
      openItem(n.id, true); break;
    }
    case 'com-add': addComment(id); break;
    case 'com-del': commit(() => { x.comments = x.comments.filter(c => c.id !== b.dataset.c); }, 'Kommentar gelöscht'); break;
  }
});
function addComment(id){
  const el = document.querySelector(`[data-newcom="${id}"]`), t = el?.value.trim();
  if (!t){ el?.focus(); return; }
  drafts[id] = '';
  commit(() => find(id).comments.push({id:uid(), author:state.author, text:t, ts:Date.now()}));
}

const TEXT = ['title', 'location', 'person', 'details', 'gear'];
document.addEventListener('focusin', () => { focusSnap = snap(); });
document.addEventListener('input', e => {
  const el = e.target, x = find(el.dataset.id);
  if (el.hasAttribute('data-author')) state.author = el.value;
  else if (el.dataset.newcom){ drafts[el.dataset.newcom] = el.value; return; }
  else if (x && TEXT.includes(el.dataset.f)){ x[el.dataset.f] = el.value; dirty = {id:x.id, f:el.dataset.f, v:el.value}; }
  else return;
  saveLocal();
});
document.addEventListener('change', e => {
  const el = e.target;
  const x = find(el.dataset.id); if (!x) return;
  const f = el.dataset.f;
  if (TEXT.includes(f)){ dirty = null; pushHistory(focusSnap); focusSnap = snap(); save(); render(); return; }
  if (f === 'tentative') return commit(() => { x.tentative = el.checked; });
  if (f === 'fixed') return commit(() => { const st = compute().res[x.id].start; x.fixed = el.checked; if (x.fixed && !x.time){ x.time = hhmm(st); x.nextDay = st >= 1440; } placeByTime(x); });
  if (f === 'nextDay') return commit(() => { x.nextDay = el.checked; placeByTime(x); });
  if (f === 'time') return el.value ? commit(() => { setTime(x, el.value); placeByTime(x); }) : undefined;
  if (f === 'anchor') return commit(() => {
    const [m] = state.items.splice(idx(x.id), 1);
    const [, e2] = groupRange(idx(el.value)); state.items.splice(e2, 0, m);
  });
  pushHistory(focusSnap);
  if (f === 'time' && el.value) x.time = el.value;
  else if (f === 'dur') x.dur = Math.max(0, Math.round(+el.value || 0));
  else { past.pop(); return; }
  focusSnap = snap(); save(); render();
});
document.addEventListener('keydown', e => {
  const el = e.target; if (e.key !== 'Enter') return;
  if (el.dataset.newcom){ e.preventDefault(); addComment(el.dataset.newcom); }
  else if (el.dataset.f === 'title'){ e.preventDefault(); el.blur(); }
});

/* ---------- Toast ---------- */
let toastT;
function toast(msg, withUndo){
  $('#toastMsg').textContent = msg; $('#toastBtn').hidden = !withUndo;
  $('#toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('show'), 5000);
}
$('#toastBtn').onclick = () => { undo(); $('#toast').classList.remove('show'); };

/* ---------- Menü ---------- */
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('[data-menu]'); if (!b) return;
  const m = b.dataset.menu;
  if (m === 'reset'){ e.stopPropagation(); armed(b, 'Sicher? Nochmal klicken', () => { $('#menu').hidden = true; commit(() => { state = fresh(); openId = null; }, 'Zurückgesetzt'); }); return; }
  $('#menu').hidden = true;
  if (m === 'export'){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'ablaufplan-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Datei gesichert');
  }
  if (m === 'import') $('#fileIn').click();
  if (m === 'print') window.print();
  if (m === 'copy'){
    const {res} = compute();
    let md = `# ${state.meta.title}\n\n| Zeit | Punkt | Notizen |\n|---|---|---|\n`;
    state.items.forEach(x => {
      const r = res[x.id];
      const bits = [x.location, x.person && 'Wer: ' + x.person, x.gear && 'Utensilien: ' + x.gear, x.details.replace(/\n/g, ' '), x.tentative && '_vorläufig_'].filter(Boolean).join(' · ');
      md += `| ${hhmm(r.start)}–${hhmm(r.end)} | ${x.parallel ? '↳ ' : ''}**${x.title}** | ${bits.replace(/\|/g, '/')} |\n`;
    });
    navigator.clipboard.writeText(md).then(() => toast('Als Markdown kopiert'), () => toast('Kopieren nicht möglich'));
  }
});
$('#fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); if (!Array.isArray(d.items)) throw 0; commit(() => { state = normalize(d); openId = null; }, 'Datei geladen'); })
    .catch(() => toast('Das ist keine gültige Ablaufplan-Datei')); e.target.value = '';
};

render();

(async () => {
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [{initializeApp}, fs] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-firestore.js')]);
    fb = {db:fs.getFirestore(initializeApp(FB_CONFIG)), fn:fs};
    setSync('busy', 'Verbinde …');
    fs.onSnapshot(fs.collection(fb.db, COL), {includeMetadataChanges:true}, applyRemote, err => { console.error(err); setSync('err', 'Offline · nur lokal'); });
  } catch (e) { console.error(e); setSync('err', 'Offline · nur lokal'); }
})();
})();
</script>
